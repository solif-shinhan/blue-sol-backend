name: Deploy STG to EC2

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        working-directory: blue-sol-backend
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: blue-sol-backend
        run: ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ (1) 멀티아키 빌드 준비
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ✅ (2) 멀티아키로 build+push (EC2 amd64에서 pull 가능해짐)
      - name: Build and push Docker image (STG)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t tony0103/shinhan-backend:stg-latest \
            -t tony0103/shinhan-backend:stg-${{ github.sha }} \
            --push \
            blue-sol-backend

      - name: Deploy STG to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            cat > .env.stg << 'EOF'
            SPRING_PROFILES_ACTIVE=stg
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            EOF

            docker compose pull backend-stg
            docker compose up -d backend-stg
            docker image prune -f
