name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ✅ gradlew는 blue-sol-backend/ 안에 있으니 경로 맞춰서 실행
      - name: Grant execute permission for gradlew
        working-directory: blue-sol-backend
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: blue-sol-backend
        run: ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ Dockerfile도 blue-sol-backend/ 안에 있으니 컨텍스트를 거기로
      - name: Build and push Docker image
        run: |
          docker build \
            -t tony0103/shinhan-backend:latest \
            -t tony0103/shinhan-backend:${{ github.sha }} \
            blue-sol-backend
          docker push tony0103/shinhan-backend:latest
          docker push tony0103/shinhan-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            # ✅ 여기서 .env를 "자동 생성/갱신" (완전 자동화 핵심)
            cat > .env << 'EOF'
            SPRING_PROFILES_ACTIVE=prod
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
